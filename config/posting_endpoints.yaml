# Multi-Website Posting Configuration & Endpoint Drivers
# Maps target domains to automated publication drivers.
# If a target domain is not explicitly listed, the default driver applies.

default_driver: "simulator"  # Options: simulator, webhook, form, wordpress

endpoints:
  # Example WordPress REST API site
  # To enable: generate an Application Password in WP Admin -> Users -> Profile
  "example-wordpress-blog.com":
    driver: "wordpress"
    api_url: "https://example-wordpress-blog.com/wp-json/wp/v2/posts"
    auth_user_env: "WP_USER_1"
    auth_pass_env: "WP_PASS_1"
    post_status: "publish"

  # Example Ghost CMS site
  "example-ghost-publication.org":
    driver: "ghost"
    api_url: "https://example-ghost-publication.org/ghost/api/v3/admin/posts/"
    admin_token_env: "GHOST_TOKEN_1"

  # Example Webhook / Headless CMS endpoint
  "example-news-api.net":
    driver: "webhook"
    api_url: "https://example-news-api.net/api/articles/submit"
    auth_header_env: "WEBHOOK_BEARER_TOKEN"

