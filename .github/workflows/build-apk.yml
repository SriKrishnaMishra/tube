name: Build Standalone Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17 (Android Gradle Requirement)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Build Web App
        run: |
          npm ci
          npm run build

      - name: Install Capacitor & Generate Android Project
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android

      - name: Build Standalone Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload DevTube Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DevTube-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
